<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Break Monitor</title>
<style>
body{margin:0;min-height:100vh;background:#111722;color:#fff;display:grid;place-items:center;text-align:center;
 font:15px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color-scheme:dark}
.b{width:520px;max-width:92vw;background:#151B27;border:1px solid #252D3A;border-radius:16px;padding:32px}
.i{width:52px;height:52px;border-radius:15px;background:#2a1818;color:#e05555;display:grid;place-items:center;margin:0 auto 14px;font-size:26px}
h1{font-size:19px;margin:0 0 8px;letter-spacing:-.02em}
p{color:#737D8C;font-size:14px;margin:0 0 6px}
code{background:#1E2530;padding:2px 7px;border-radius:5px;font-size:13px}
ul{text-align:left;color:#737D8C;font-size:13.5px;margin:16px 0 0;padding-left:20px}
.r{display:flex;gap:10px;justify-content:center;margin-top:22px}
button{font:inherit;padding:10px 18px;border-radius:10px;border:1px solid #252D3A;background:#151B27;color:#fff;font-weight:600;cursor:pointer}
button.p{background:#fff;color:#111722;border-color:transparent}
</style></head><body>
<div class="b">
  <div class="i">!</div>
  <h1 id="t">Can't reach the server</h1>
  <p id="m"></p>
  <p id="u"></p>
  <ul>
    <li>Is the server PC switched on and running Break Monitor?</li>
    <li>Is this PC on the same network / Wi-Fi?</li>
    <li>Has the server PC's firewall been allowed through on that port?</li>
    <li>Has the server PC's IP address changed? A fixed address avoids this.</li>
  </ul>
  <div class="r">
    <button class="p" onclick="window.breakMonitor.retry()">Try again</button>
    <button onclick="window.breakMonitor.reconfigure()">Change setup</button>
  </div>
</div>
<script>
const p = new URLSearchParams(location.search);
document.getElementById('m').textContent = p.get('m') || 'Connection failed.';
const u = p.get('u'); if (u) document.getElementById('u').innerHTML = '<code>' + u + '</code>';
</script></body></html>
